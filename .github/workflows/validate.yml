name: Validate resume website

# Roda em todo push e PR: privacidade → testes de consistência → build → privacidade do site gerado.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Privacidade (documentos e dados pessoais versionados)
        run: npm run check:privacy
      - name: Consistência LinkedIn × site × PDF + agente
        run: npm test
      - name: Typecheck e build
        run: npm run build
      - name: Privacidade do site gerado (dist/)
        run: npm run check:privacy

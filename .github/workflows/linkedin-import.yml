name: Import LinkedIn profile

# Dispara quando um PDF do LinkedIn é enviado para a pasta linkedin/ (ex.: GitHub web → Add file → Upload files).
# O workflow converte o PDF em src/data/linkedin.json (sem dados de contato), REMOVE o PDF do repositório
# e faz o commit. O deploy roda em seguida (deploy.yml escuta a conclusão deste workflow).
on:
  push:
    branches: [main]
    paths: ['linkedin/*.pdf', 'linkedin/*.PDF']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Converter PDF → JSON
        id: parse
        run: npm run linkedin:import
      - name: Validar build com os novos dados
        run: npm run build
      - name: Remover PDF e commitar JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch -r linkedin/*.pdf linkedin/*.PDF || true
          if [ "${{ steps.parse.outcome }}" = "success" ]; then git add src/data/linkedin.json; fi
          if git diff --cached --quiet; then echo "Nada para commitar."; exit 0; fi
          git commit -m "chore(data): importa perfil do LinkedIn e remove o PDF"
          git push

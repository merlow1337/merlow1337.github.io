name: Deploy portfolio to GitHub Pages

# Só publica se passar nas mesmas barreiras do validate.yml.
# Se alguém subir um PDF ou dado pessoal, o deploy FALHA e o site continua na versão anterior.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Privacidade (repositório)
        run: npm run check:privacy
      - name: Testes de consistência
        run: npm test
      - name: Typecheck e build
        run: npm run build
      - name: Privacidade (site gerado)
        run: npm run check:privacy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
